name: Deploy Backend (Railway)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy to Railway
    runs-on: ubuntu-latest
    environment: production

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: darukaa
          POSTGRES_PASSWORD: darukaa
          POSTGRES_DB: darukaa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darukaa -d darukaa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://darukaa:darukaa@localhost:5432/darukaa
      SECRET_KEY: ci-only-not-a-real-secret-key-value-0123456789

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Verify migrations before deploying
        run: |
          alembic upgrade head
          alembic check

      - name: Run tests against a real PostGIS database
        run: pytest

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy
        run: railway up --service "${{ secrets.RAILWAY_SERVICE_NAME }}" --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Smoke test the deployed API
        run: |
          for attempt in 1 2 3 4 5 6; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.PUBLIC_API_URL }}/api/v1/health" || echo 000)
            if [ "$STATUS" = "200" ]; then
              echo "Deployed API is healthy."
              curl -s "${{ secrets.PUBLIC_API_URL }}/api/v1/health"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $STATUS, retrying in 15s..."
            sleep 15
          done
          echo "Deployed API did not become healthy in time." >&2
          exit 1
